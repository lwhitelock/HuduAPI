name: Publish New Version

on:
  push:
    tags: '*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Build PowerShell Module
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module ModuleBuilder -Repository PSGallery -Scope CurrentUser -Force
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Build-Module -SemVer $version
          Test-ModuleManifest -Path .\Output\HuduAPI\HuduAPI.psd1 | Out-Null

      - name: Publish PowerShell Module
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PS_GALLERY_KEY)) {
            throw 'The PS_GALLERY_KEY secret is required to publish to PowerShell Gallery.'
          }
          Publish-Module -Path .\Output\HuduAPI -Repository PSGallery -NuGetApiKey $env:PS_GALLERY_KEY
